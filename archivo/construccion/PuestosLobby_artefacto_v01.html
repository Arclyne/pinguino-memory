.ver{position:fixed;right:16px;top:16px;background:#14182a;color:#ffe06a;font-family:'Lilita One';padding:6px 12px;border-radius:12px;z-index:3}

const PG=(()=>{
  function studTexture(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,64,64);

      const crest=new THREE.Group();crest.position.set(0,2.85,.15);P.add(crest);const flames=[];

let drag=null,auto=true,idle=0;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};auto=false;idle=0;});
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;camState.yaw-= (e.clientX-drag.x)*.006;camState.pitch=Math.min(.9,Math.max(.02,camState.pitch+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY};});
canvas.addEventListener('wheel',e=>{camState.dist=Math.min(80,Math.max(22,camState.dist+e.deltaY*.03));e.preventDefault();},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();camState.dist=w<700?66:50;}
addEventListener('resize',resize);resize();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(!drag){idle+=dt;if(idle>3)auto=true;}if(auto)camState.yaw+=dt*.12;
  const yaw=camState.yaw+Math.PI,p=camState.pitch,d=camState.dist;
  cam.position.set(camState.target.x+Math.sin(yaw)*Math.cos(p)*d,camState.target.y+Math.sin(p)*d,camState.target.z+Math.cos(yaw)*Math.cos(p)*d);cam.lookAt(camState.target);
