<script>
const PG=(()=>{
  function studTexture(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,64,64);

    g.beginPath();for(let i=0;i<8;i++){const r=i%2?6:30,a=i*Math.PI/4;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();g.beginPath();g.arc(0,0,8,0,7);g.fill();return new THREE.CanvasTexture(c);}

function burst(){const r=document.getElementById('info').getBoundingClientRect();const cx=innerWidth*.35,cy=innerHeight*.45;for(let i=0;i<120;i++){const a=Math.random()*6.28,v=6+Math.random()*12;bp.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*6,c:['#ff3b5c','#ffd23f','#3fd0ff','#7dff7a','#ff7ae0','#fff'][i%6],l:90,s:4+Math.random()*6,st:i%3===0});}}
function drawBurst(){bc.width=innerWidth;bc.height=innerHeight;bp=bp.filter(p=>p.l>0);bp.forEach(p=>{p.l--;p.vy+=.35;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.r+=.2;bx2.save();bx2.translate(p.x,p.y);bx2.rotate(p.r);bx2.globalAlpha=Math.min(1,p.l/30);bx2.fillStyle=p.c;
  if(p.st){bx2.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.s*.45:p.s;bx2.lineTo(Math.cos(k*Math.PI/5)*rr,Math.sin(k*Math.PI/5)*rr);}bx2.fill();}else bx2.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);bx2.restore();});}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1400);}
$('buy').onclick=()=>{burst();toast('¡Comprado! 🎉');happyT=3;conf.visible=true;confT=3;};
$('equip').onclick=()=>{equipped=sel;$('equip').textContent='EQUIPADO ✓';toast('¡'+PG.SKINS[sel].name+' equipado!');happyT=2;};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
canvas.addEventListener('click',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);for(const id of IDS){if(ray.intersectObject(pens[id].g,true).length){select(id);return;}}});
const cam={p:new THREE.Vector3(0,20,-70),l:new THREE.Vector3(0,6,0)};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
select('fire');
let t=0,last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;sky.material.uniforms.t.value=t;
  IDS.forEach((id,i)=>{const P=pens[id];const isSel=!overview&&id===sel;P.p.update(t+i,dt,(isSel&&happyT>0)||(overview&&happyT>0)?'happy':'idle');
    if(spin)P.p.group.rotation.y=(isSel?Math.sin(t*.6)*.9:Math.sin(t*.5+i)*.5);else P.p.group.rotation.y+=(0-P.p.group.rotation.y)*.1;
    const k=isSel||overview?1:0;P.spot.intensity+=(k*.5-P.spot.intensity)*.1;P.beam.material.opacity+=((isSel?.06:overview?.04:.02)-P.beam.material.opacity)*.1;P.ring.rotation.z+=dt*(isSel?2:.5);P.rays.rotation.z+=dt*.4;P.rays.material.opacity+=((isSel?.55:0)-P.rays.material.opacity)*.08;P.ring.material.emissiveIntensity=1+Math.sin(t*4+i)*.5;
    const sc=isSel?1.45:1.25;P.p.group.scale.lerp(new THREE.Vector3(sc,sc,sc),.1);});
  happyT=Math.max(0,happyT-dt);confT=Math.max(0,confT-dt);if(confT<=0)conf.visible=false;
  if(conf.visible){const a=cg.attributes.position.array;for(let i=0;i<CONF;i++){a[i*3+1]-=(6+i%5)*dt;a[i*3]+=Math.sin(t*2+i)*dt*3;if(a[i*3+1]<0)a[i*3+1]+=60;}cg.attributes.position.needsUpdate=true;}
  const wide=innerWidth<1000;let tp,tl;
  if(overview){tp=new THREE.Vector3(0,30,wide?-140:-114);tl=new THREE.Vector3(0,6,0);}
  else{const x=X[IDS.indexOf(sel)];tp=new THREE.Vector3(x-(wide?0:7),12,-30);tl=new THREE.Vector3(x-(wide?0:7),7.5,0);}
  cam.p.lerp(tp,.06);cam.l.lerp(tl,.06);camera.position.copy(cam.p);camera.lookAt(cam.l);
  drawBurst();renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
