<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huevos por rareza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* noche de vitrina: el huevo brilla sobre un pedestal y el catálogo va en tarjetas oscuras con borde de su rareza */
  --night: #0b1220;
  --panel: #121b2c;
  --panel-2: #18233a;
  --ink: #eef3fb;
  --muted: #93a2bb;
  --line: rgba(238, 243, 251, 0.10);
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); }
.viewer { position: relative; height: min(68vh, 640px); min-height: 440px; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.card {
  position: absolute; top: 16px; left: 16px;
  width: min(320px, calc(100% - 32px));
  background: rgba(14, 21, 35, 0.78);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-top: 3px solid var(--rc, #fff);
  border-radius: 18px;
  padding: 16px;
  display: grid; gap: 12px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
.rarity { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; color: var(--rc); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: -6px 0 0; text-wrap: balance; }
.hatch { font-size: 13px; font-weight: 800; }
.hatch span { color: var(--muted); font-weight: 700; }
p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: rgba(238, 243, 251, 0.06); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; border-radius: 9px; padding: 7px 4px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); background: transparent; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.effect { font-size: 13px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
.effect dt { color: var(--muted); }
.effect dd { margin: 0; font-weight: 700; }
.hint { position: absolute; bottom: 12px; right: 16px; font-size: 12px; color: var(--muted); background: rgba(14, 21, 35, 0.7); padding: 6px 12px; border-radius: 999px; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 72px; display: grid; gap: 36px; }
.ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 8px; }
.step { background: var(--panel); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); border-top: 3px solid var(--c); display: grid; gap: 2px; }
.step b { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--c); }
.step span { font-size: 12px; color: var(--muted); line-height: 1.35; }
#catalog { display: grid; gap: 36px; }
section h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0 0 2px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
section h2 em { font-style: normal; color: var(--muted); font-size: 18px; }
section h2 small { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--muted); }
section > p { margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
.egg {
  background: radial-gradient(120% 80% at 50% 35%, color-mix(in srgb, var(--c) 16%, var(--panel)), var(--panel) 70%);
  border: 2.5px solid var(--c);
  border-radius: 16px;
  padding: 8px 8px 12px;
  display: grid; justify-items: center; gap: 3px;
  cursor: pointer; text-align: center; font: inherit; color: inherit;
  box-shadow: 0 0 var(--g, 0px) color-mix(in srgb, var(--c) 55%, transparent);
  transition: transform 0.15s ease;
}
.egg:hover { transform: translateY(-3px); }
.egg[aria-current="true"] { outline: 3px solid color-mix(in srgb, var(--c) 45%, transparent); outline-offset: 3px; }
.egg img { width: 128px; height: 128px; }
.egg .r { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: var(--c); text-transform: uppercase; }
.egg .n { font-weight: 800; font-size: 14px; line-height: 1.2; }
.egg .h { font-size: 12px; color: var(--muted); }
.egg.secret { border-image: linear-gradient(135deg, #ffffff, #7f8ba3, #ffffff, #2a2f3d) 1; border-radius: 0; }
@media (max-width: 560px) {
  .viewer { height: 500px; }
  .card { top: auto; bottom: 12px; padding: 12px; gap: 8px; }
  .card p, .effect, .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .egg { transition: none; } }
</style>
</head>
<body>
<div class="viewer">
  <div id="stage"></div>
  <aside class="card" id="card">
    <div class="rarity" id="rarity-label"></div>
    <h1 id="egg-name"></h1>
    <div class="hatch"><span>Nace:</span> <b id="egg-hatch"></b></div>
    <p id="egg-desc"></p>
    <div class="tabs" role="group" aria-label="Dónde verlo">
      <button id="tab-show" type="button" aria-pressed="true">Vitrina</button>
      <button id="tab-nest" type="button" aria-pressed="false">Nido</button>
      <button id="tab-track" type="button" aria-pressed="false">Pista</button>
    </div>
    <dl class="effect">
      <dt>Bioma</dt><dd id="egg-biome"></dd>
      <dt>Efecto</dt><dd id="egg-effect"></dd>
    </dl>
  </aside>
  <div class="hint">Arrastra para girar · rueda para acercar</div>
</div>

<main>
  <div class="ladder" id="ladder"></div>
  <div id="catalog"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const LAYER = 0.5, LAYERS = 12, SQUARENESS = 2.5, MAX_WIDTH = 4.4, TOP = LAYERS * LAYER;
const TAU = Math.PI * 2;

const RARITIES = {
  comun: { label: "Común", color: "#aab4c1", glow: 0, step: "Color fuerte y un patrón. Casi quieto." },
  raro: { label: "Raro", color: "#3fa9ff", glow: 6, step: "+ un detalle propio y destellos." },
  epico: { label: "Épico", color: "#b06bff", glow: 10, step: "+ accesorio que se mueve y partículas." },
  legendario: { label: "Legendario", color: "#ffbf2e", glow: 16, step: "+ oro, pieza grande, flota y aura." },
  mitico: { label: "Mítico", color: "#ff4fa3", glow: 20, step: "Se sale de la silueta del huevo." },
  celestial: { label: "Celestial", color: "#4ff0ff", glow: 24, step: "Luz propia, columna de luz y órbitas." },
  secreto: { label: "Secreto", color: "#f4f6fb", glow: 26, step: "Rompe las reglas: el huevo se deshace." },
};

const BIOMES = [
  { name: "Navideño", note: "Solo comunes (D-040a). Colores de Navidad fuertes sobre la forma base." },
  { name: "Ciudad Nevada", note: "Comunes y raros. Ladrillo, taxis y luces de ciudad de noche." },
  { name: "Valle del Avión", note: "De raro a legendario. Hélices, alas y turbinas." },
  { name: "Cueva de Cristal", note: "De raro a mítico. Piedra, hielo y cristales que brillan desde adentro." },
  { name: "Bosque de Auroras", note: "De épico a celestial. Animales del bosque polar y luces de aurora." },
  { name: "Volcán Helado", note: "De épico a celestial. Fuego contra hielo: grietas de lava, obsidiana y fénix." },
  { name: "Abismo Polar", note: "De legendario a secreto. Criaturas del mar bajo el hielo, bioluminiscencia." },
  { name: "Cosmos Glaciar", note: "De legendario a secreto. El espacio: cometas, planetas y estrellas." },
];

const hash = (a, b, c) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
const mid = (c, n, span) => Math.abs(c - (n - 1) / 2) <= span;
const spots = (list) => (i, f, c, n) => list.some(([li, lf, fr]) => li === i && lf === f && Math.min(n - 1, Math.floor(fr * n)) === c);
const diag = (i, f, c, n, period, width) => ((c + f * n + i) % period + period) % period < width;
const glow = (color) => ({ color, glow: true });

const EGGS = [
  // 1 · Navideño
  { id: "nevado", biome: 0, rarity: "comun", name: "Huevo Nevado", hatch: "Pingüino Nevado",
    desc: "El común aprobado convertido en muñeco de nieve: ojos de carbón, nariz de zanahoria, brazos de rama y nieve amontonada en la base.",
    effect: "Se mece; los brazos saludan",
    shell: [0xE6DAC5, 0xFBF7EF], tip: 0xFBF7EF,
    tile: (i, f, c, n) => spots([[3, 1, 0.75], [5, 2, 0.4], [8, 3, 0.85], [4, 2, 0.6], [9, 1, 0.15], [6, 3, 0.3]])(i, f, c, n) ? 0xC2AD86 : null,
    extras: (api) => {
      api.face({ layer: 8, gap: 0.7, size: 0.5, eye: 0x1C1C22 });
      const z = api.widthAt(7) / 2;
      [[0.55, 0.5, 0xF07A1A], [0.42, 0.45, 0xF58A2A], [0.28, 0.4, 0xFF9C3A]].forEach(([s, d, c], k) => api.box(s, s, d, c, { y: api.yAt(7), z: z + 0.2 + k * 0.42 }));
      [-1.0, -0.5, 0, 0.5, 1.0].forEach((x) => api.box(0.24, 0.24, 0.16, 0x1C1C22, { x, y: api.yAt(5.6) - Math.abs(x) * -0.2 - 0.15, z: api.widthAt(6) / 2 + 0.06 }));
      [0, 1].forEach((k) => api.box(0.32, 0.32, 0.16, 0x1C1C22, { y: api.yAt(4 - k * 1.6), z: api.widthAt(3) / 2 + 0.06 }));
      for (const s of [-1, 1]) {
        const arm = new THREE.Group();
        arm.position.set(s * api.widthAt(6) / 2, api.yAt(6), 0);
        arm.add(api.make(1.9, 0.2, 0.2, 0x6B4423, { x: s * 0.95, rz: s * 0.35 }));
        arm.add(api.make(0.7, 0.16, 0.16, 0x6B4423, { x: s * 1.75, y: 0.85, rz: s * 1.1 }));
        arm.add(api.make(0.6, 0.16, 0.16, 0x6B4423, { x: s * 2.0, y: 0.45, rz: s * -0.2 }));
        api.add(arm);
        api.update((t) => { arm.rotation.z = s * (Math.sin(t * 2.2) * 0.12 + (s > 0 ? Math.max(0, Math.sin(t * 1.1)) * 0.25 : 0)); });
      }
      for (let k = 0; k < 9; k++) { const a = k / 9 * TAU + 0.3; api.box(0.9 + hash(k, 1, 1) * 0.6, 0.5, 0.9, 0xFFFFFF, { x: Math.cos(a) * 2.3, y: 0.15, z: Math.sin(a) * 2.3, ry: a }); }
    } },
  { id: "galleta", biome: 0, rarity: "comun", name: "Huevo de Galleta", hatch: "Pingüino Galleta",
    desc: "Hombre de jengibre: cara y sonrisa de glaseado, tres gomitas de botón, bracitos con puños glaseados y glaseado que escurre de la punta.",
    effect: "Se mece; los bracitos se mueven",
    shell: [0x8A4A1E, 0xCC8C4C], tip: 0xFFFFFF,
    tile: (i, f, c, n) => {
      if (i === 11 || (i === 10 && c % 2 === 0)) return 0xFFFFFF;
      if (f !== 0 && ((i === 2 && c % 2 === 0) || (i === 3 && c % 2 === 1))) return 0xFFFFFF;
      if (f === 0 && i === 6 && !mid(c, n, 0.5) && Math.abs(c - (n - 1) / 2) < 2.1) return 0xFFFFFF;
      return null;
    },
    extras: (api) => {
      api.face({ layer: 8, gap: 0.7, size: 0.55, eye: 0x3A1E0E, ring: 0xFFFFFF });
      const z = api.widthAt(4) / 2 + 0.2;
      [[0xE5383B, 5], [0x2DB25B, 3.6], [0xFFFFFF, 2.2]].forEach(([c, l]) => { api.box(0.6, 0.55, 0.35, c, { y: api.yAt(l) - 0.1, z }); api.box(0.25, 0.15, 0.37, 0xFFFFFF, { x: -0.1, y: api.yAt(l) + 0.1, z: z + 0.01, outline: false }); });
      for (const s of [-1, 1]) {
        const arm = new THREE.Group();
        arm.position.set(s * api.widthAt(5) / 2, api.yAt(5), 0);
        arm.add(api.make(1.3, 0.9, 0.8, 0xB97A3E, { x: s * 0.55, rz: s * -0.5 }));
        arm.add(api.make(0.22, 0.95, 0.85, 0xFFFFFF, { x: s * 0.95, y: -0.3, rz: s * -0.5 }));
        api.add(arm);
        api.update((t) => { arm.rotation.z = s * Math.sin(t * 2 + s) * 0.15; });
      }
      for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; api.box(0.3, 0.55, 0.3, 0xFFFFFF, { x: Math.cos(a) * 1.15, y: api.yAt(10) - 0.35, z: Math.sin(a) * 1.15 }); }
    } },
  { id: "baston", biome: 0, rarity: "comun", name: "Huevo de Bastón", hatch: "Pingüino Bastón",
    desc: "Bastón de caramelo con rayas en espiral, el gancho del bastón saliendo de la punta y un moño verde de listón al frente.",
    effect: "Se mece; el gancho gira despacio",
    shell: [0xEFE9E1, 0xFFFFFF], tip: 0xE5383B,
    tile: (i, f, c, n) => diag(i, f, c, n, 4, 2) ? (diag(i, f, c, n, 4, 1) ? 0xE5383B : 0xC21F2A) : null,
    extras: (api) => {
      const hook = new THREE.Group();
      hook.position.y = TOP + 0.2;
      for (let k = 0; k < 11; k++) {
        const a = k / 10 * Math.PI * 1.1;
        const x = k < 3 ? 0 : -(1 - Math.cos(a - 0.3)) * 0.9, y = k < 3 ? k * 0.45 : 0.9 + Math.sin(a - 0.3) * 0.9 + 0.3;
        hook.add(api.make(0.6, 0.48, 0.6, k % 2 ? 0xFFFFFF : 0xE5383B, { x, y, rz: k < 3 ? 0 : (a - 0.3) }));
      }
      api.add(hook);
      api.update((t) => { hook.rotation.y = Math.sin(t * 0.6) * 0.6; });
      const z = api.widthAt(6) / 2 + 0.2, y = api.yAt(6);
      api.box(1.1, 0.75, 0.4, 0x1F9A4E, { x: -0.6, y, z, rz: 0.4 });
      api.box(1.1, 0.75, 0.4, 0x1F9A4E, { x: 0.6, y, z, rz: -0.4 });
      api.box(0.45, 0.45, 0.5, 0x187A3D, { y, z: z + 0.05 });
      api.box(0.35, 1.0, 0.2, 0x1F9A4E, { x: -0.35, y: y - 0.75, z, rz: -0.25 });
      api.box(0.35, 1.0, 0.2, 0x1F9A4E, { x: 0.35, y: y - 0.75, z, rz: 0.25 });
    } },
  { id: "bufanda", biome: 0, rarity: "comun", name: "Huevo de Bufanda", hatch: "Pingüino Bufanda",
    desc: "Niño de invierno: gorro tejido rojo con pompón, carita con cachetes rosados y pico, y bufanda a rayas que cuelga.",
    effect: "Se mece; el pompón rebota",
    shell: [0x3E6A9E, 0x7FA6D6], tip: 0x7FA6D6,
    tile: (i, f, c) => i >= 1 && i <= 5 && hash(i, f, c) < 0.14 ? 0xFFFFFF : null,
    extras: (api) => {
      for (const i of [8, 9, 10, 11]) api.ring(api.widthAt(i) + 0.2, 0.3, LAYER, api.yAt(i), i === 8 ? 0xFFFFFF : (i % 2 ? 0xD7263D : 0xB81D32));
      api.box(1.6, 0.4, 1.6, 0xD7263D, { y: TOP + 0.2 });
      const pom = api.box(1.2, 1.1, 1.2, 0xFFFFFF, { y: TOP + 0.95 });
      api.update((t) => { pom.position.y = TOP + 0.95 + Math.abs(Math.sin(t * 2.4)) * 0.2; });
      api.face({ layer: 6.6, gap: 0.65, size: 0.45, eye: 0x111111, beak: 0xFFA21F, cheeks: 0xFF8FA8 });
      const w = api.widthAt(4) + 0.36, y = api.yAt(4);
      api.ring(w, 0.36, 0.8, y, 0xFFC93C);
      api.ring(w + 0.02, 0.38, 0.18, y, 0x2F80ED);
      api.box(0.95, 2.0, 0.28, 0xFFC93C, { x: 0.7, y: y - 1.1, z: w / 2, rz: 0.1 });
      api.box(0.97, 0.18, 0.3, 0x2F80ED, { x: 0.72, y: y - 1.0, z: w / 2, rz: 0.1 });
    } },
  { id: "regalo", biome: 0, rarity: "comun", name: "Huevo de Regalo", hatch: "Pingüino Regalo",
    desc: "Caja de regalo: tapa que sobresale, papel verde con lunares, listón dorado en cruz, moño enorme de cuatro lazos y etiqueta colgando.",
    effect: "Se mece; la etiqueta se balancea",
    shell: [0x1A6E3C, 0x36A862], tip: 0xF2C14E, layers: { 6: 0xF2C14E },
    tile: (i, f, c, n) => mid(c, n, 0.5) ? 0xF2C14E : (hash(i, f, c) < 0.14 ? 0xE5383B : null),
    extras: (api) => {
      api.ring(api.widthAt(9) + 0.4, 0.4, 0.7, api.yAt(9), 0x166234);
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + Math.PI / 4;
        api.box(1.5, 0.7, 0.55, k % 2 ? 0xF2C14E : 0xE0A92E, { x: Math.cos(a) * 0.65, y: TOP + 0.65, z: Math.sin(a) * 0.65, ry: -a, rz: 0.45 });
      }
      api.box(0.6, 0.6, 0.6, 0xE0A92E, { y: TOP + 0.6 });
      const tag = new THREE.Group();
      tag.position.set(0.6, TOP + 0.4, 0.6);
      tag.add(api.make(0.06, 1.2, 0.06, 0xE0A92E, { y: -0.6, outline: false }), api.make(0.9, 0.6, 0.08, 0xFFF6E0, { y: -1.4 }), api.make(0.3, 0.26, 0.1, 0xE5383B, { y: -1.4, z: 0.02, outline: false }));
      api.add(tag);
      api.update((t) => { tag.rotation.z = Math.sin(t * 1.8) * 0.25; });
    } },

  // 2 · Ciudad Nevada
  { id: "ladrillo", biome: 1, rarity: "comun", name: "Huevo de Ladrillo", hatch: "Pingüino Albañil",
    desc: "Casita de ladrillo: puerta con picaporte dorado, ventana encendida con postigos verdes, nieve que escurre y chimenea echando humo.",
    effect: "Humo de chimenea, ventana encendida",
    shell: [0x8F3524, 0xC0583F], tip: 0xFFFFFF, layers: { 10: 0xFFFFFF, 11: 0xFFFFFF },
    tile: (i, f, c) => i === 9 && c % 2 === 0 ? 0xFFFFFF : (i >= 1 && i < 9 && (c + i) % 2 === 0 ? 0x9E3F2C : null),
    extras: (api) => {
      const zf = (i) => api.widthAt(i) / 2;
      api.box(1.2, 1.7, 0.2, 0x5B3420, { y: 0.9, z: zf(1) + 0.1 });
      api.box(0.2, 0.2, 0.25, 0xFFC93C, { x: 0.35, y: 0.9, z: zf(1) + 0.2, outline: false });
      api.box(1.0, 0.9, 0.18, 0xFFD36B, { y: api.yAt(6.5), z: zf(6) + 0.08, glow: true, dim: 1.2 });
      api.box(0.1, 0.9, 0.22, 0x5B3420, { y: api.yAt(6.5), z: zf(6) + 0.1, outline: false });
      for (const s of [-1, 1]) api.box(0.45, 1.0, 0.16, 0x2E7D4F, { x: s * 0.78, y: api.yAt(6.5), z: zf(6) + 0.1 });
      api.box(1.3, 0.15, 0.4, 0xFFFFFF, { y: api.yAt(6.5) - 0.55, z: zf(6) + 0.18 });
      api.box(0.75, 1.4, 0.75, 0x7A3324, { x: 0.8, y: TOP + 0.4, z: -0.5 });

        } else if (p.mode === "helix") {

        } else if (p.mode === "disc") {
          const ang = a + t * (1.5 + h1), r = 3.4 + h2 * 3.2; bit.position.set(Math.cos(ang) * r, 3.2 + Math.sin(ang * 2) * 0.15, Math.sin(ang) * r); s = 0.7;
        } else if (p.mode === "spiral") {
          const r = 1.5 + life * 4.5, ang = a * 0.25 + life * TAU * 1.5 + (k % 2) * Math.PI; bit.position.set(Math.cos(ang) * r, 3.2 + (h1 - 0.5) * 0.6, Math.sin(ang) * r); s = 1 - life * 0.7;
        } else {
          const r = 2.6 + h1 * 0.9; bit.position.set(Math.cos(a) * r, 0.3 + life * 7.5, Math.sin(a) * r);
        }
        bit.scale.setScalar(Math.max(0.001, s));
      });
      add(bit);
    }
  }
  if (spec.aura) {
    const ring = api.ring(5.4, 0.16, 0.16, 0.08, spec.aura, { glow: true, dim: 2, outline: false });
    const ring2 = api.ring(6.4, 0.08, 0.08, 0.08, spec.aura, { glow: true, dim: 1.6, outline: false });
    updaters.push((t) => { ring.rotation.y = t * 0.6; ring2.rotation.y = -t * 0.4; });
  }
  if (spec.pillar) {
    const c = document.createElement("canvas");
    c.width = 4; c.height = 128;
    const g = c.getContext("2d");
    const col = new THREE.Color(spec.pillar);
    const grad = g.createLinearGradient(0, 0, 0, 128);
    grad.addColorStop(0, `rgba(${col.r * 255},${col.g * 255},${col.b * 255},0)`);
    grad.addColorStop(1, `rgba(${col.r * 255},${col.g * 255},${col.b * 255},0.55)`);
    g.fillStyle = grad; g.fillRect(0, 0, 4, 128);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.6, 22, 24, 1, true), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
    pillar.position.y = 10;
    add(pillar);
    updaters.push((t) => { pillar.material.opacity = thumb ? 0.28 : 0.38 + Math.sin(t * 2) * 0.1; });
  }
  if (spec.light) {
    const light = new THREE.PointLight(lin(spec.light), 1.2, 12);
    light.position.y = 3;
    add(light);
    updaters.push((t) => { light.intensity = 1.0 + Math.sin(t * 1.8) * 0.3; });
  }
  return { group, update: (t, cam) => updaters.forEach((fn) => fn(t, cam)) };
}

function addLights(scene) {
  scene.add(new THREE.HemisphereLight(lin(0xe6f2ff), lin(0x3a3f58), 0.62));
  const key = new THREE.DirectionalLight(lin(0xfff1dc), 0.95);
  key.position.set(8, 14, 9);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -10, right: 10, top: 12, bottom: -6 });
  scene.add(key);
  const fill = new THREE.DirectionalLight(lin(0xffffff), 0.3);
  fill.position.set(2, 4, 14);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(lin(0x9fc8ff), 0.7);
  rim.position.set(-10, 6, -10);
  scene.add(rim);
}

function backdrop(hex, card) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 512;
  const g = c.getContext("2d");
  const base = card ? "#121b2c" : "#0b1220";
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  const grad = g.createRadialGradient(256, card ? 230 : 250, 10, 256, 260, card ? 300 : 380);
  const col = new THREE.Color(hex);
  grad.addColorStop(0, `rgba(${col.r * 255},${col.g * 255},${col.b * 255},${card ? 0.34 : 0.42})`);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

function composerFor(renderer, scene, camera, w, h, strength) {
  const target = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
  const composer = new THREE.EffectComposer(renderer, target);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(w, h), strength, 0.5, 0.97);
  composer.addPass(bloom);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  return { composer, bloom };
}

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
addLights(scene);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
camera.position.set(13, 8, 17);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, minDistance: 9, maxDistance: 55, maxPolarAngle: Math.PI * 0.5 });
const view = composerFor(renderer, scene, camera, 800, 600, 0.9);

function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function buildNest() {
  const nest = new THREE.Group();
  const next = rand(42);
  const tones = [0x8a5a3b, 0x9c6a45, 0x7a4c30, 0xa8774f];
  for (let ring = 0; ring < 3; ring++) {
    const radius = 2.4 + ring * 0.25, count = 20 + ring * 4;
    for (let k = 0; k < count; k++) {
      const a = (k / count) * TAU + next() * 0.3;
      nest.add(makeBox(0.28, 0.28, 1.4 + next() * 1.1, tones[k % 4], { x: Math.cos(a) * radius, y: 0.2 + ring * 0.24, z: Math.sin(a) * radius, rx: (next() - 0.5) * 0.5, ry: -a + (next() - 0.5) * 0.7, rz: (next() - 0.5) * 0.4, outline: false }));
    }
  }
  nest.add(makeBox(3.6, 0.3, 3.6, 0x6e4529, { y: 0.15, outline: false }));
  return nest;
}
function ground(color) { const g = makeBox(60, 1, 60, color, { y: -0.5, studs: STUD, outline: false }); g.castShadow = false; return g; }
const showScene = new THREE.Group();
const pedestal = [makeBox(7, 0.6, 7, 0x1B2438, { y: 0.3 }), makeBox(5.6, 0.5, 5.6, 0x222D46, { y: 0.85 })];
const pedestalEdge = [makeBox(7.08, 0.1, 7.08, 0xffffff, { y: 0.62, glow: true, dim: 1.6, outline: false })];
showScene.add(...pedestal, ...pedestalEdge, ground(0x0A101C));
const nestScene = new THREE.Group();
nestScene.add(ground(0x63b356), buildNest());
const trackScene = new THREE.Group();
trackScene.add(ground(0xdfe9f3));
const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.9, 16, 24, 1, true), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
beam.position.y = 8;
trackScene.add(beam);
scene.add(showScene, nestScene, trackScene);
const holder = new THREE.Group();
scene.add(holder);
let current = null, currentSpec = null, mode = "show";

function beamMap(rgb) {
  const c = document.createElement("canvas");
  c.width = 4; c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, `rgba(${rgb},0)`);
  grad.addColorStop(1, `rgba(${rgb},0.4)`);
  g.fillStyle = grad; g.fillRect(0, 0, 4, 128);
  return new THREE.CanvasTexture(c);
}

function setMode(next) {
  mode = next;
  showScene.visible = next === "show";
  nestScene.visible = next === "nest";
  trackScene.visible = next === "track";
  for (const k of ["show", "nest", "track"]) document.getElementById(`tab-${k}`).setAttribute("aria-pressed", String(k === next));
  applyBackground();
  controls.target.set(0, next === "track" ? 5.2 : 4, 0);
}
function applyBackground() {
  const r = currentSpec ? RARITIES[currentSpec.rarity] : RARITIES.comun;
  scene.background = mode === "show" ? backdrop(r.color) : backdrop(mode === "nest" ? "#bfe3f7" : "#dfefff");
  scene.fog = mode === "show" ? new THREE.Fog(lin(0x0b1220), 22, 48) : null;
}
document.getElementById("tab-show").addEventListener("click", () => setMode("show"));
document.getElementById("tab-nest").addEventListener("click", () => setMode("nest"));
document.getElementById("tab-track").addEventListener("click", () => setMode("track"));

function setEgg(id, scroll) {
  const spec = eggsById[id] || EGGS[0];
  if (current) holder.remove(current.group);
  current = buildEgg(spec);
  currentSpec = spec;
  holder.add(current.group);
  const r = RARITIES[spec.rarity];
  const far = ["mitico", "celestial", "secreto"].includes(spec.rarity) ? 1.45 : 1;
  camera.position.set(13 * far, 8 * far, 17 * far);
  pedestalEdge.forEach((m) => [].concat(m.material).forEach((mt) => { mt.color = lin(r.color); mt.emissive = lin(r.color); }));
  beam.material.map = beamMap(spec.beam || "255,248,232");
  beam.material.needsUpdate = true;
  document.getElementById("card").style.setProperty("--rc", r.color);
  document.getElementById("rarity-label").textContent = r.label.toUpperCase();
  document.getElementById("egg-name").textContent = spec.name;
  document.getElementById("egg-hatch").textContent = spec.hatch;
  document.getElementById("egg-desc").textContent = spec.desc;
  document.getElementById("egg-biome").textContent = `${spec.biome + 1} · ${BIOMES[spec.biome].name}`;
  document.getElementById("egg-effect").textContent = spec.effect;
  document.querySelectorAll(".egg[data-id]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === spec.id)));
  if (location.hash !== `#${spec.id}`) history.replaceState(null, "", `#${spec.id}`);
  applyBackground();
  if (scroll) window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function thumbnails() {
  const size = 256;
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setSize(size, size);
  const s = new THREE.Scene();
  addLights(s);
  const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const { composer } = composerFor(r, s, cam, size, size, 0.6);
  const out = {};
  for (const spec of EGGS) {
    const big = RARITIES[spec.rarity];
    const reach = ["mitico", "celestial", "secreto"].includes(spec.rarity) ? 1.55 : spec.rarity === "legendario" ? 1.12 : 1;
    cam.position.set(9 * reach, 6.6 * reach, 12.5 * reach);
    cam.lookAt(0, spec.hover ? 3.6 : 3.3, 0);
    s.background = backdrop(big.color, true);
    const egg = buildEgg(spec, true);
    if (spec.hover) egg.group.position.y = 0.4;
    egg.update(1.15, cam);
    s.add(egg.group);
    composer.render();
    out[spec.id] = r.domElement.toDataURL("image/png");
    s.remove(egg.group);
  }
  r.dispose();
  return out;
}

function renderCatalog() {
  document.getElementById("ladder").innerHTML = Object.values(RARITIES).map((r) => `<div class="step" style="--c:${r.color}"><b>${r.label}</b><span>${r.step}</span></div>`).join("");
  const thumbs = thumbnails();
  const catalog = document.getElementById("catalog");
  catalog.innerHTML = BIOMES.map((b, bi) => {
    const eggs = EGGS.filter((e) => e.biome === bi);
    const cards = eggs.map((e) => {
      const r = RARITIES[e.rarity];
      return `<button class="egg${e.rarity === "secreto" ? " secret" : ""}" type="button" data-id="${e.id}" style="--c:${r.color};--g:${r.glow}px"><img src="${thumbs[e.id]}" alt="${e.name}"><span class="r">${r.label}</span><span class="n">${e.name}</span><span class="h">${e.hatch}</span></button>`;
    }).join("");
    return `<section><h2>${bi + 1} · ${b.name} <small>${eggs.length} huevos</small></h2><p>${b.note}</p><div class="grid">${cards}</div></section>`;
  }).join("");
  catalog.querySelectorAll(".egg[data-id]").forEach((b) => b.addEventListener("click", () => setEgg(b.dataset.id, true)));
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  view.composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  view.composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
window.addEventListener("hashchange", () => setEgg(location.hash.slice(1)));

renderCatalog();
resize();
setEgg(location.hash.slice(1) || "nevado");
setMode("show");

const clock = new THREE.Clock();
function wobble(t) { const c = t % 4.5; return c > 0.9 ? 0 : Math.sin(c * Math.PI * 4.4) * 0.07 * (1 - c / 0.9); }
function frame() {
  const t = reduceMotion ? 1.15 : clock.getElapsedTime();
  const hover = currentSpec.hover;
  const baseY = mode === "show" ? 1.1 : mode === "nest" ? 0.35 : 2.4;
  if (mode === "track") {
    holder.position.y = baseY + Math.sin(t * 1.6) * 0.25;
    holder.rotation.set(0, t * 0.5, 0);
    beam.material.opacity = 0.75 + Math.sin(t * 2) * 0.12;
  } else {
    holder.position.y = baseY + (hover ? 1.0 + Math.sin(t * 1.6) * 0.25 : 0);
    holder.rotation.set(0, mode === "show" ? t * 0.25 : 0, hover ? 0 : wobble(t));
  }
  current.update(t, camera);
  controls.update();
  view.composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
